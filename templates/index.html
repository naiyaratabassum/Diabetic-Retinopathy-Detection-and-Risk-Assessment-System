<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title> Diabetic Retinopathy</title>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://maxcdn.bootstrapcdn.com/bootstrap/3.4.1/css/bootstrap.min.css">
  <script src="https://ajax.googleapis.com/ajax/libs/jquery/3.5.1/jquery.min.js"></script>
  <script src="https://maxcdn.bootstrapcdn.com/bootstrap/3.4.1/js/bootstrap.min.js"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <style>

#bgVideo {
  position: fixed;
  top: 0;
  left: 0;
  min-width: 100vw;
  min-height: 100vh;
  z-index: -1;
  object-fit: cover;
  opacity:90;
}
    body {
      margin: 0;
      font-family: 'Poppins', sans-serif;
      background: linear-gradient(120deg, #2e2e6a, #6a0572);
      height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      color: #fff;
    }

    .navbar-inverse {
      background-color: #1c1c2e;
      border: none;
    }

    .navbar-inverse .navbar-brand,
    .navbar-inverse .navbar-nav > li > a {
      color: #fff;
      
    }
    .navbar-nav > li.active > a {
  background-color: transparent !important;
  color: #fff !important;
  
 

}
.navbar-inverse .navbar-nav > li > a,
.navbar-inverse .navbar-brand {
  font-size: 18px;
  padding-top: 18px;
  line-height: 30px;
}


    .wave-bg {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: radial-gradient(circle at center, #3c3b6e, #1f1f47);
      
      background-size: cover;
      z-index: -1;
      opacity:0;
    }

    .login-container {
      background: rgba(11, 6, 33, 0.7);
      padding: 40px;
      border-radius: 20px;
      display: flex;
      flex-direction: column;
      width: 100%;
      max-width: 400px;
      box-shadow: 0 0 40px rgba(0, 0, 0, 0.7);
      z-index: 2;
    }

    .login-container h2 {
      text-align: center;
      margin-bottom: 30px;
      font-weight: 600;
    }

    .form-group {
      position: relative;
      margin-bottom: 20px;
    }

    .form-group i {
      position: absolute;
      left: 15px;
      top: 50%;
      transform: translateY(-50%);
      color: #90caf9;
    }

    .form-control {
      padding-left: 40px;
      border-radius: 10px;
      border: none;
    }

    .btn-login {
      background-color: #1edce9;
      color: white;
      border: none;
      border-radius: 10px;
      padding: 10px 0;
      font-size: 16px;
      margin-top: 20px;
      width: 100%;
    }

    .btn-login:hover {
      background-color: #1bd8d2;
    }

    .form-switch {
      margin-top: 20px;
      text-align: center;
    }

    .form-switch a {
      color: #90caf9;
      text-decoration: underline;
      cursor: pointer;
    }

    .icon-container {
      text-align: center;
      font-size: 60px;
      margin-bottom: 20px;
      color: #90caf9;
    }

    .form-section {
      display: none;
    }

    .form-section.active {
      display: block;
    }
  </style>
</head>
<body>
    <video autoplay muted loop id="bgVideo">
        <source src="{{ url_for('static', filename='eye_video.mp4') }}" type="video/mp4">
        Your browser does not support HTML5 video.
      </video>
    
  <div class="wave-bg"></div>
  <nav class="navbar navbar-inverse navbar-fixed-top">
    <div class="container-fluid">
      <div class="navbar-header">
        <a class="navbar-brand" href="#">RETINOPATHY</a>

      </div>
      <ul class="nav navbar-nav">
        <li class="active"><a href="#">Home</a></li>
        <li><a href="{{url_for('dashboard')}}">About the Disease</a></li>
        <li><a href="/hospitals_map">Find Hospitals</a></li>
        <li><a href="{{url_for('patient')}}">Analyse Yourself</a></li>
      </ul>
      <ul class="nav navbar-nav navbar-right">
        <li><a href="#"><span class="glyphicon glyphicon-user"></span> User</a></li>
      </ul>
    </div>
  </nav>

  <div class="login-container">
    <div class="icon-container">
      <i class="fa-solid fa-user-circle"></i>
    </div>
    <form method="post" action="{{ url_for('userlog') }}" id="form1" class="form-section active">
      <h2>User Login</h2>
      <div class="form-group">
        <i class="fa fa-user"></i>
        <input type="text" class="form-control" id="username" placeholder="Enter username" name="name" required>
      </div>
      <div class="form-group">
        <i class="fa fa-lock"></i>
        <input type="password" class="form-control" id="password" placeholder="Enter password" name="password" required>
      </div>
      <button type="submit" class="btn btn-login">Login</button>
      <div class="form-switch">
        Don't have an account? <a data-value="#form2" onclick="toggleform(event)">Sign up</a>
      </div>
    </form>

    <form method="post" action="{{ url_for('userreg') }}" id="form2" class="form-section">
      <h2>Sign Up</h2>
      <div class="form-group">
        <i class="fa fa-user"></i>
        <input type="text" class="form-control" id="signup-username" placeholder="Username" name="name" required>
      </div>
      <div class="form-group">
        <i class="fa fa-envelope"></i>
        <input type="email" class="form-control" id="signup-email" placeholder="Email" name="email" required>
      </div>
      <div class="form-group">
        <i class="fa fa-phone"></i>
        <input type="tel" class="form-control" id="signup-phone" placeholder="Mobile No." name="phone" required>
      </div>
      <div class="form-group">
        <i class="fa fa-lock"></i>
        <input type="password" class="form-control" id="signup-password" placeholder="Password" name="password" required>
      </div>
      <button type="submit" class="btn btn-login">Sign Up</button>
      <div class="form-switch">
        Already have an account? <a data-value="#form1" onclick="toggleform(event)">Login</a>
      </div>
    </form>
  </div>

  <script>
    function toggleform(e) {
      var Id = e.target.getAttribute('data-value');
      let forms = ['#form1', '#form2'];
      forms.forEach(function(item) {
        if (Id === item) {
          $(item).addClass("active");
        } else {
          $(item).removeClass("active");
        }
      });
    }
  </script>
  

</body>
</html>
